<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目经历 · 出圈框架</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #eef1f6;
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      max-width: 1240px;
      width: 100%;
      background: #ffffff;
      border-radius: 1.25rem;
      padding: 0;
      box-shadow: 0 8px 32px rgba(0, 20, 50, 0.08), 0 1px 3px rgba(0, 20, 50, 0.04);
      border: 1px solid #dde3ec;
      overflow: hidden;
    }

    .project-bar {
      background: #1a2b4c;
      padding: 1.3rem 2.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
      border-bottom: 3px solid #2d5b9e;
    }

    .project-bar-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .project-badge {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: #2d5b9e;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .project-bar h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
      margin: 0;
      line-height: 1.3;
    }

    .project-bar .project-meta {
      font-size: 0.78rem;
      color: #8ba3c7;
      font-weight: 400;
      margin-top: 0.1rem;
    }

    .project-bar-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }

    .status-text {
      font-size: 0.78rem;
      color: #8ba3c7;
    }

    .collapse-all-btn {
      background: #2d5b9e;
      border: 1px solid #2d5b9e;
      color: #ffffff;
      padding: 0.45rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .collapse-all-btn:hover {
      background: #244b82;
      border-color: #244b82;
    }

    .content {
      padding: 2rem 2.2rem 2.5rem;
    }

    .section-block {
      margin-bottom: 1.5rem;
      background: #ffffff;
      border-radius: 0.875rem;
      border: 1px solid #e4e9f0;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 20, 50, 0.03);
      transition: margin-bottom 0.2s ease;
    }

    .section-block.collapsed {
      margin-bottom: 0.8rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.4rem;
      background: #f8fafd;
      border-bottom: 1px solid #e8ecf3;
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .section-header:hover {
      background: #f1f5fa;
    }

    .section-block.collapsed .section-header {
      border-bottom: none;
    }

    .section-header::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #2d5b9e;
    }

    .section-header.stage-1::before { background: #2d5b9e; }
    .section-header.stage-2::before { background: #3b7dd8; }
    .section-header.stage-3::before { background: #1a2b4c; }

    .section-num {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: #ffffff;
      flex-shrink: 0;
    }

    .num-1 { background: #2d5b9e; }
    .num-2 { background: #3b7dd8; }
    .num-3 { background: #1a2b4c; }

    .section-title-wrap {
      flex: 1;
    }

    .section-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: #1a2b4c;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .section-sub {
      font-size: 0.78rem;
      color: #7a8aa0;
      font-weight: 400;
      margin-top: 0.1rem;
    }

    .collapse-arrow {
      color: #7a8aa0;
      font-size: 0.85rem;
      transition: transform 0.2s ease;
      flex-shrink: 0;
      margin-left: 0.5rem;
    }

    .section-block.collapsed .collapse-arrow {
      transform: rotate(-90deg);
    }

    .section-body {
      padding: 1.2rem 1.4rem 1.4rem;
      max-height: 2000px;
      opacity: 1;
      transition: max-height 0.3s ease, opacity 0.2s ease, padding 0.2s ease;
      overflow: hidden;
    }

    .section-block.collapsed .section-body {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .module-nav {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .main-dropdown {
      position: relative;
      display: inline-block;
    }

    .main-dropdown-btn {
      background: #ffffff;
      border: 1px solid #ccd6e3;
      padding: 0.65rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #1a2b4c;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .main-dropdown-btn i.fa-chevron-down {
      font-size: 0.65rem;
      transition: transform 0.15s;
      color: #7a8aa0;
    }

    .main-dropdown-btn.active i.fa-chevron-down {
      transform: rotate(180deg);
    }

    .main-dropdown-btn:hover {
      border-color: #2d5b9e;
      background: #f8fafd;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 440px;
      max-width: 90vw;
      background: #ffffff;
      border-radius: 10px;
      padding: 0.5rem;
      box-shadow: 0 12px 32px rgba(0, 20, 50, 0.14);
      z-index: 100;
      display: none;
      border: 1px solid #e8ecf3;
    }

    .dropdown-menu.show {
      display: block;
      animation: fadeSlide 0.15s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-item {
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      padding: 0.65rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: 0.88rem;
    }

    .menu-item:hover {
      background: #f4f6fa;
    }

    .menu-item.active {
      background: #eef3fa;
    }

    .menu-icon {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      background: #eef3fa;
      color: #2d5b9e;
    }

    .menu-text {
      flex: 1;
    }

    .menu-text .title {
      font-weight: 600;
      color: #1a2b4c;
      margin-bottom: 0.1rem;
      font-size: 0.88rem;
    }

    .menu-text .desc {
      font-size: 0.75rem;
      color: #7a8aa0;
      line-height: 1.4;
    }

    .detail-panel {
      background: #f8fafd;
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
      border: 1px solid #e8ecf3;
      border-left: 4px solid #2d5b9e;
      display: none;
    }

    .detail-panel.show {
      display: block;
      animation: fadeSlide 0.15s ease;
    }

    .detail-panel h3 {
      font-size: 0.98rem;
      margin-bottom: 0.5rem;
      color: #1a2b4c;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-weight: 700;
    }

    .detail-panel h3 i {
      color: #2d5b9e;
    }

    .detail-panel p {
      font-size: 0.88rem;
      color: #3d4d66;
      line-height: 1.65;
      margin-bottom: 0.9rem;
    }

    .case-box {
      background: #ffffff;
      border-radius: 8px;
      padding: 0.9rem 1.1rem;
      border: 1px solid #e8ecf3;
    }

    .case-box strong {
      color: #2d5b9e;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.45rem;
      font-weight: 700;
    }

    .case-box p {
      margin: 0;
      font-style: italic;
      color: #5b6b83;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.9rem;
    }

    .input-card {
      background: #ffffff;
      border-radius: 8px;
      padding: 0.85rem 0.95rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #e0e6ef;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .input-card:hover {
      border-color: #b8c9dd;
      background: #fafbfd;
    }

    .input-card:focus-within {
      border-color: #2d5b9e;
      box-shadow: 0 0 0 3px rgba(45, 91, 158, 0.08);
    }

    .input-card label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #1a2b4c;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 0.4rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid #eef1f6;
      letter-spacing: -0.01em;
    }

    .input-card label i {
      color: #2d5b9e;
      font-size: 0.8rem;
      width: 15px;
      text-align: center;
    }

    .input-card textarea, .input-card input {
      border: none;
      padding: 0.15rem 0.1rem 0.15rem 0;
      font-size: 0.88rem;
      background: transparent;
      resize: vertical;
      outline: none;
      color: #1a2b4c;
      font-weight: 400;
      width: 100%;
      border-radius: 4px;
      line-height: 1.5;
    }

    .input-card textarea {
      min-height: 58px;
      font-family: inherit;
    }

    .input-card input {
      min-height: auto;
    }

    .input-card textarea::placeholder, .input-card input::placeholder {
      color: #a8b5c7;
      font-weight: 400;
      font-size: 0.82rem;
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 0.9rem;
    }

    .action-left {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 0.6rem 1.3rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-sample {
      background: #2d5b9e;
      color: #ffffff;
      border: 1px solid #2d5b9e;
    }

    .btn-sample:hover {
      background: #244b82;
      border-color: #244b82;
    }

    .btn-reset {
      background: #ffffff;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    .btn-reset:hover {
      background: #fef2f2;
      border-color: #ef4444;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .sample-hint {
      font-size: 0.78rem;
      color: #7a8aa0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .sample-hint i {
      color: #a8b5c7;
    }

    .history-panel {
      margin-top: 1.1rem;
      background: #f8fafd;
      border-radius: 10px;
      padding: 1.1rem 1.3rem;
      border: 1px solid #e8ecf3;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .history-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #3d4d66;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .history-title i {
      color: #2d5b9e;
    }

    .btn-small {
      border: none;
      padding: 0.28rem 0.85rem;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn-clear-history {
      background: #ffffff;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    .btn-clear-history:hover {
      background: #fef2f2;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 0.2rem;
    }

    .history-list::-webkit-scrollbar {
      width: 5px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: #ccd6e3;
      border-radius: 10px;
    }

    .history-item {
      background: #ffffff;
      border-radius: 8px;
      padding: 0.75rem 0.95rem;
      border: 1px solid #e8ecf3;
      border-left: 3px solid #3b7dd8;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.9rem;
      transition: 0.15s;
    }

    .history-item:hover {
      border-color: #ccd6e3;
      box-shadow: 0 2px 8px rgba(0, 20, 50, 0.04);
    }

    .history-content {
      flex: 1;
      font-size: 0.8rem;
      color: #5b6b83;
      line-height: 1.5;
    }

    .history-content .h-time {
      font-size: 0.68rem;
      color: #a8b5c7;
      margin-bottom: 0.22rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .history-content .h-preview {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #3d4d66;
    }

    .history-restore {
      background: #eef3fa;
      border: none;
      color: #2d5b9e;
      padding: 0.35rem 0.85rem;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: 0.15s;
      flex-shrink: 0;
    }

    .history-restore:hover {
      background: #2d5b9e;
      color: #ffffff;
    }

    .history-empty {
      text-align: center;
      color: #a8b5c7;
      font-size: 0.8rem;
      padding: 1rem 0;
      font-style: italic;
    }

    .generate-btn {
      background: #1a2b4c;
      border: none;
      padding: 0.95rem 2rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.98rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 12px rgba(26, 43, 76, 0.15);
    }

    .generate-btn:hover {
      background: #243b63;
      box-shadow: 0 6px 18px rgba(26, 43, 76, 0.22);
    }

    .generate-btn:active {
      transform: translateY(1px);
    }

    .result-panel {
      margin-top: 1.3rem;
      background: #f8fafd;
      border-radius: 10px;
      padding: 1.3rem 1.5rem;
      border: 1px solid #e8ecf3;
      border-left: 4px solid #1a2b4c;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.9rem;
    }

    .result-header h2 {
      font-size: 0.98rem;
      font-weight: 700;
      color: #1a2b4c;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .result-header h2 i {
      color: #2d5b9e;
    }

    .copy-btn {
      background: #ffffff;
      border: 1px solid #ccd6e3;
      color: #3d4d66;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: 0.15s;
      font-size: 0.78rem;
    }

    .copy-btn:hover {
      background: #2d5b9e;
      border-color: #2d5b9e;
      color: #ffffff;
    }

    .result-text {
      font-size: 0.95rem;
      line-height: 1.8;
      background: #ffffff;
      padding: 1.3rem;
      border-radius: 8px;
      border: 1px solid #e8ecf3;
      color: #1a2b4c;
      white-space: pre-wrap;
      word-break: break-word;
      font-weight: 400;
      letter-spacing: 0.1px;
      min-height: 90px;
      text-align: justify;
    }

    .placeholder-text {
      color: #a8b5c7;
      font-style: italic;
    }

    .hint-tip {
      font-size: 0.75rem;
      color: #a8b5c7;
      margin-top: 0.45rem;
      text-align: right;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.3rem;
    }

    .hint-tip i {
      color: #ccd6e3;
    }

    [data-tooltip] {
      position: relative;
      cursor: help;
    }

    [data-tooltip]:before {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 130%;
      left: 0;
      background: #1a2b4c;
      color: #e8ecf3;
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 400;
      width: 220px;
      text-align: left;
      line-height: 1.4;
      box-shadow: 0 8px 20px rgba(0, 20, 50, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: 0.15s;
      z-index: 200;
      white-space: normal;
    }

    [data-tooltip]:hover:before {
      opacity: 1;
      bottom: 140%;
    }

    @media (max-width: 700px) {
      body { padding: 1rem 0.8rem; }
      .project-bar { padding: 1rem 1.2rem; }
      .project-bar h1 { font-size: 1.05rem; }
      .content { padding: 1.2rem; }
      .section-body { padding: 1rem; }
      .dropdown-menu { width: 300px; }
      .form-grid { grid-template-columns: 1fr; }
      .action-row { flex-direction: column; align-items: stretch; }
      .action-left { flex-direction: column; }
      .history-item { flex-direction: column; align-items: stretch; }
      .history-restore { align-self: flex-end; }
      .project-bar-right { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="project-bar">
    <div class="project-bar-left">
      <div class="project-badge">
        <i class="fas fa-chart-line"></i>
      </div>
      <div>
        <h1>项目经历 · 出圈框架</h1>
        <div class="project-meta">经历结构化剖析 → 结构化输入 → 一键生成经历描述</div>
      </div>
    </div>
    <div class="project-bar-right">
      <span class="status-dot"></span>
      <span class="status-text">工作区就绪</span>
      <button class="collapse-all-btn" id="collapseAllBtn" type="button">
        <i class="fas fa-angles-down"></i> 一键展开
      </button>
    </div>
  </div>

  <div class="content">
    <!-- ========== 模块一 ========== -->
    <div class="section-block collapsed" id="section-1">
      <div class="section-header stage-1" data-section="1">
        <div class="section-num num-1">1</div>
        <div class="section-title-wrap">
          <div class="section-title">经历结构化剖析</div>
          <div class="section-sub">点击下拉框，选择模块，查看定义与案例</div>
        </div>
        <i class="fas fa-chevron-down collapse-arrow"></i>
      </div>
      <div class="section-body">
        <div class="module-nav">
          <div class="main-dropdown">
            <button class="main-dropdown-btn" id="mainDropdownBtn" type="button">
              <i class="fas fa-list-ul"></i> 选择框架模块
              <i class="fas fa-chevron-down"></i>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
              <button class="menu-item" data-module="a" type="button">
                <span class="menu-icon"><i class="fas fa-bullseye"></i></span>
                <span class="menu-text">

    <!-- ========== 模块二 ========== -->
    <div class="section-block collapsed" id="section-2">
      <div class="section-header stage-2" data-section="2">
        <div class="section-num num-2">2</div>
        <div class="section-title-wrap">
          <div class="section-title">结构化输入</div>
          <div class="section-sub">把项目信息填入对应卡片，越具体越出彩</div>
        </div>

      <div class="section-body">
        <div class="action-row">
          <div class="action-left">

          <span class="sample-hint">
            <i class="fas fa-clock-rotate-left"></i>
            <span id="historyCount">0</span> 条历史记录

        </div>

        <div class="form-grid">
          <div class="input-card" data-tooltip="项目背景：背景是什么？项目开始的前提是什么？">
            <label><i class="fas fa-circle-info"></i> 项目背景</label>
            <textarea id="background" placeholder="例：后台管理系统操作繁琐，数据经常出错"></textarea>

          <div class="input-card" data-tooltip="人员角色：你在项目中承担什么角色？">

            <label><i class="fas fa-handshake"></i> 对接人员</label>

        <div class="history-panel" id="historyPanel">
          <div class="history-header">
            <div class="history-title">
              <i class="fas fa-clock-rotate-left"></i> 历史记录（点击“恢复”可重新填入并生成）
            </div>
            <div class="history-actions">
              <button class="btn-small btn-clear-history" id="clearHistoryBtn" type="button">
                <i class="fas fa-trash-can"></i> 清空
              </button>
            </div>
          </div>
          <div class="history-list" id="historyList">
            <div class="history-empty">暂无历史记录，填写信息后点击“一键重置”会自动保存。</div>
          </div>

    <!-- ========== 模块三 ========== -->
    <div class="section-block collapsed" id="section-3">
      <div class="section-header stage-3" data-section="3">
        <div class="section-num num-3">3</div>
        <div class="section-title-wrap">
          <div class="section-title">一键生成经历描述</div>
          <div class="section-sub">自动按“背景＋角色＋难点＋解决方案＋果实”结构生成</div>
        </div>
        <i class="fas fa-chevron-down collapse-arrow"></i>
      </div>
      <div class="section-body">
        <button class="generate-btn" id="generateBtn" type="button">
          <i class="fas fa-magic"></i> 一键生成 · 出圈项目描述
        </button>

        <div class="result-panel">
          <div class="result-header">
            <h2><i class="fas fa-star"></i> 你的项目经历（出圈版）</h2>
            <button class="copy-btn" id="copyBtn" type="button"><i class="fas fa-copy"></i> 复制</button>
          </div>
          <div class="result-text" id="resultText">
            <span class="placeholder-text">填写“结构化输入”中的信息，点击“一键生成”即可获得简洁、出彩的项目经历描述。</span>
          </div>
        </div>
        <div class="hint-tip">
          <i class="fas fa-lightbulb"></i> 结构：背景 + 角色 + 难点 + 解决方案 + 果实
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // ===== 模块折叠/展开 =====
    const sectionHeaders = document.querySelectorAll('.section-header');
    sectionHeaders.forEach(header => {
      header.addEventListener('click', () => {
        const sectionId = header.dataset.section;
        const section = document.getElementById('section-' + sectionId);
        if (section) {
          section.classList.toggle('collapsed');
        }
      });
    });

    // ===== 一键收起 / 一键展开 =====
    const collapseAllBtn = document.getElementById('collapseAllBtn');
    let allCollapsed = true; // 默认全部折叠

    // 更新按钮文字为「一键展开」（因为当前是折叠状态）
    collapseAllBtn.innerHTML = '<i class="fas fa-angles-down"></i> 一键展开';

    collapseAllBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      allCollapsed = !allCollapsed;
      const sections = document.querySelectorAll('.section-block');
      sections.forEach(section => {
        if (allCollapsed) {
          section.classList.add('collapsed');
        } else {
          section.classList.remove('collapsed');
        }
      });
      if (allCollapsed) {
        collapseAllBtn.innerHTML = '<i class="fas fa-angles-down"></i> 一键展开';
      } else {
        collapseAllBtn.innerHTML = '<i class="fas fa-angles-up"></i> 一键收起';
      }
    });

    // ===== 模块数据 =====
    const modules = {
      a: {
        title: 'a · 定义',
        desc: '项目经历想要出圈，如何描述它是关键中的关键，全看你怎么说。核心是结果导向、动词精准、数据支撑，用高度凝练的语言把项目价值“翻译”成面试官能秒懂的亮点。',
        case: '“负责XX后台优化，通过抽离公共组件，将操作效率提升50%，数据错误率降为0。” —— 一句话说清角色、动作、量化结果。'
      },
      b: {
        title: 'b · 交代背景',
        desc: '项目开始的前提是什么？背景是什么？背景说不明白，就显得经历很突兀。需要交代业务痛点、市场机会、技术债务或战略目标，让面试官理解“为什么做这个项目”。',
        case: '“原后台系统操作步骤多，数据靠手动录入，经常出错，每月因此产生大量返工。” —— 背景有痛点、有场景。'
      },
      c: {
        title: 'c · 突出难点',
        desc: '一个项目经历是否有价值，就看它难度如何，难度不够，价值无法突出。难点可以来自技术瓶颈、资源限制、跨团队协作、时间压力等。描述时最好有对比：原来多难，现在多好。',
        case: '“老代码没有注释和文档，改一个功能可能影响多个页面，牵一发动全身。” —— 体现了维护成本和复杂性。'
      },
      d: {
        title: 'd · 如何应对困难',
        desc: '面对项目中的难点，如何解决困难。展现你的思考路径、技术选型、协作方式和决策依据。把“解决方案”结构化，体现主动性和逻辑。',
        case: '“先梳理核心流程，抽离出5个公共组件，统一数据校验规则，并加上操作日志方便追溯。” —— 有分析、有步骤、有落地。'
      },
      e: {
        title: 'e · 结构框架',
        desc: '背景＋角色＋难点＋解决方案＋果实。这是最经典的黄金叙事结构，让面试官像听故事一样理解你的贡献。每一环都要精简、有力。',
        case: '“（背景）后台操作繁琐易错；（角色）负责后台模块开发；（难点）老代码混乱影响面大；（方案）抽离公共组件+统一校验；（果实）效率提升50%，错误率降为0。” —— 结构清晰，层层递进。'
      }
    };

    const mainBtn = document.getElementById('mainDropdownBtn');
    const menu = document.getElementById('dropdownMenu');
    const menuItems = document.querySelectorAll('.menu-item');
    const detailPanel = document.getElementById('detailPanel');
    const detailTitle = document.getElementById('detailTitle');
    const detailDesc = document.getElementById('detailDesc');
    const detailCase = document.getElementById('detailCase');

    mainBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.toggle('show');
      mainBtn.classList.toggle('active');
    });

    menuItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const moduleKey = item.dataset.module;
        const data = modules[moduleKey];
        if (!data) return;

        menuItems.forEach(mi => mi.classList.remove('active'));
        item.classList.add('active');

        detailTitle.innerHTML = '<i class="fas fa-info-circle"></i> ' + data.title;
        detailDesc.innerText = data.desc;
        detailCase.innerText = data.case;
        detailPanel.classList.add('show');

        menu.classList.remove('show');
        mainBtn.classList.remove('active');
      });
    });

    document.addEventListener('click', () => {
      menu.classList.remove('show');
      mainBtn.classList.remove('active');
    });
    menu.addEventListener('click', (e) => e.stopPropagation());

    const fieldIds = ['background', 'role', 'difficulty', 'solution', 'result', 'teamSize', 'stakeholders'];

    function getFormData() {
      const data = {};
      fieldIds.forEach(id => {
        const el = document.getElementById(id);
        data[id] = el ? el.value.trim() : '';
      });
      return data;
    }

    function hasContent(data) {
      return fieldIds.some(id => data[id] && data[id].length > 0);
    }

    function fillForm(data) {
      fieldIds.forEach(id => {
        const el = document.getElementById(id);
        if (el && data[id] !== undefined) {
          el.value = data[id];
        }
      });
    }

    function clearForm() {
      fieldIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
    }

    let memoryHistory = [];

    function loadHistory() {
      if (memoryHistory.length > 0) return memoryHistory;
      try {
        const raw = localStorage.getItem('project_exp_history_v14');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            memoryHistory = parsed;
            return memoryHistory;
          }
        }
      } catch (e) {}
      return [];
    }

    function saveHistory(history) {
      memoryHistory = history;
      try {
        localStorage.setItem('project_exp_history_v14', JSON.stringify(history));
      } catch (e) {}
    }

    function isSameRecord(data1, data2) {
      return fieldIds.every(id => (data1[id] || '') === (data2[id] || ''));
    }

    function addHistory(data) {
      const history = loadHistory();
      const existingIndex = history.findIndex(item => isSameRecord(item.data, data));

      if (existingIndex !== -1) {
        const existing = history[existingIndex];
        existing.time = new Date().toLocaleString('zh-CN', { hour12: false });
        history.splice(existingIndex, 1);
        history.unshift(existing);
      } else {
        const record = {
          id: 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
          time: new Date().toLocaleString('zh-CN', { hour12: false }),
          data: JSON.parse(JSON.stringify(data))
        };
        history.unshift(record);
      }

      if (history.length > 20) history.length = 20;
      saveHistory(history);
      renderHistory();
    }

    function clearAllHistory() {
      if (confirm('确定要清空所有历史记录吗？此操作不可恢复。')) {
        saveHistory([]);
        renderHistory();
      }
    }

    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');

    function renderHistory() {
      const history = loadHistory();
      historyCount.innerText = history.length;

      if (history.length === 0) {
        historyList.innerHTML = '<div class="history-empty">暂无历史记录，填写信息后点击“一键重置”会自动保存。</div>';
        return;
      }

      historyList.innerHTML = history.map(item => {
        const d = item.data;
        const previewParts = [];
        if (d.background) previewParts.push('背景：' + d.background);
        if (d.role) previewParts.push('角色：' + d.role);
        if (d.difficulty) previewParts.push('难点：' + d.difficulty);
        const preview = previewParts.length > 0 ? previewParts.join('｜') : '（空记录）';

        return '<div class="history-item">' +
          '<div class="history-content">' +
            '<div class="h-time"><i class="far fa-clock"></i> ' + item.time + '</div>' +
            '<div class="h-preview">' + escapeHtml(preview) + '</div>' +
          '</div>' +
          '<button class="history-restore" data-id="' + item.id + '" type="button">' +
            '<i class="fas fa-rotate-right"></i> 恢复' +
          '</button>' +
        '</div>';
      }).join('');

      historyList.querySelectorAll('.history-restore').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const history = loadHistory();
          const record = history.find(h => h.id === id);
          if (record) {
            fillForm(record.data);
            generateDescription();
            document.querySelector('.form-grid').scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });
    }

    const resetBtn = document.getElementById('resetBtn');
    resetBtn.addEventListener('click', () => {
      const currentData = getFormData();
      if (hasContent(currentData)) {
        addHistory(currentData);
      }
      clearForm();
      document.getElementById('resultText').innerHTML = '<span class="placeholder-text">填写“结构化输入”中的信息，点击“一键生成”即可获得简洁、出彩的项目经历描述。</span>';
      resetBtn.innerHTML = '<i class="fas fa-check"></i> 已重置';
      setTimeout(() => {
        resetBtn.innerHTML = '<i class="fas fa-rotate-left"></i> 一键重置';
      }, 1200);
    });

    const sampleBtn = document.getElementById('sampleBtn');
    const sampleData = {
      background: '后台管理系统操作步骤繁琐，数据靠手动录入，经常出错，每月因此产生大量返工。',
      role: '负责后台模块开发，参与需求梳理与功能设计。',
      difficulty: '老代码没有注释和文档，改一个功能可能影响多个页面，牵一发动全身。',
      solution: '先梳理核心流程，抽离出5个公共组件，统一数据校验规则，并加上操作日志方便追溯。',
      result: '操作效率提升50%，数据错误率降为0，用户反馈明显变好。',
      teamSize: '3人',
      stakeholders: '对接产品、测试'
    };

    sampleBtn.addEventListener('click', () => {
      const currentData = getFormData();
      if (hasContent(currentData)) {
        addHistory(currentData);
      }
      fillForm(sampleData);
      generateDescription();

      sampleBtn.innerHTML = '<i class="fas fa-check"></i> 已填充';
      setTimeout(() => {
        sampleBtn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> 填充示例';
      }, 1500);
    });

    const generateBtn = document.getElementById('generateBtn');
    const resultDiv = document.getElementById('resultText');
    const copyBtn = document.getElementById('copyBtn');

    function getVal(id) {
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function generateDescription() {
      const background = getVal('background');
      const role = getVal('role');
      const difficulty = getVal('difficulty');
      const solution = getVal('solution');
      const result = getVal('result');
      const teamSize = getVal('teamSize');
      const stakeholders = getVal('stakeholders');

      if (!background && !role && !difficulty && !solution && !result && !teamSize && !stakeholders) {
        resultDiv.innerHTML = '<span class="placeholder-text">请至少填写一项信息，生成专属项目经历。</span>';
        return;
      }

      let sentences = [];

      let first = '';
      if (background) {
        first += background;
        if (!/[。！？]$/.test(first)) first += '。';
      }
      let roleInfo = '';
      if (role) {
        const roleText = (role.startsWith('负责') || role.startsWith('担任') || role.startsWith('主导') || role.startsWith('参与')) ? role : '负责' + role;
        roleInfo = '我' + roleText;
        if (teamSize) roleInfo += '，团队共' + teamSize;
        if (stakeholders) roleInfo += '，主要对接' + stakeholders;
        if (!/[。！？]$/.test(roleInfo)) roleInfo += '。';
      } else {
        if (teamSize || stakeholders) {
          roleInfo = '项目中';
          if (teamSize) roleInfo += '团队共' + teamSize;
          if (stakeholders) roleInfo += (teamSize ? '，' : '') + '主要对接' + stakeholders;
          roleInfo += '。';
        }
      }
      if (first || roleInfo) sentences.push(first + roleInfo);

      let second = '';
      if (difficulty) {
        second += '过程中遇到的主要挑战是：' + difficulty;
        if (!/[。！？]$/.test(second)) second += '。';
      }
      if (solution) {
        const solText = (solution.startsWith('通过') || solution.startsWith('采用') || solution.startsWith('先') || solution.startsWith('我')) ? solution : '我' + solution;
        second += '为此，' + solText;
        if (!/[。！？]$/.test(second)) second += '。';
      }
      if (second) sentences.push(second);

      if (result) {
        let third = '最终，' + result;
        if (!/[。！？]$/.test(third)) third += '。';
        sentences.push(third);
      }

      if (sentences.length === 0) {
        resultDiv.innerHTML = '<span class="placeholder-text">请至少填写一项信息，生成专属项目经历。</span>';
        return;
      }

      resultDiv.innerText = sentences.join('');
    }

    generateBtn.addEventListener('click', function(e) {
      e.preventDefault();
      generateDescription();
    });

    copyBtn.addEventListener('click', () => {
      const text = resultDiv.innerText;
      if (!text || text.includes('填写“结构化输入”') || text.includes('请至少填写一项')) {
        alert('暂无可复制的内容，请先生成描述。');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        const originalHTML = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制';
        setTimeout(() => {
          copyBtn.innerHTML = originalHTML;
        }, 1500);
      }).catch(() => {
        alert('复制失败，请手动复制。');
      });
    });

    document.getElementById('clearHistoryBtn').addEventListener('click', clearAllHistory);

    renderHistory();
  });
</script>
</body>
</html>
